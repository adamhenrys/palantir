<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palantir · RXN</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2; --accent:#3b82f6; --accent2:#2563eb;
    --green:#22c55e; --greenbg:#0f2a1a; --amber:#f59e0b; --red:#ef4444; --redbg:#2a1414;
    --chip:#232833;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
  a{color:var(--accent)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 10px}
  .logo{font-weight:800;font-size:22px;letter-spacing:.5px}
  .logo span{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px}
  .lang{margin-left:auto;display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .lang button{background:transparent;color:var(--muted);padding:4px 12px;border-radius:999px;font-size:13px}
  .lang button.on{background:var(--accent);color:#fff}
  .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 16px}
  .menu button{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:12px 6px;border-radius:16px;font-size:12px;font-weight:600;line-height:1.2;text-align:center}
  .menu button .mi{font-size:22px;line-height:1}
  .menu button.on{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(37,99,235,.35)}
  .menu button.on:hover{background:linear-gradient(160deg,var(--accent),var(--accent2))}
  .menu .badge{position:absolute;top:6px;right:8px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .field{flex:1;min-width:150px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    padding:9px 10px;border-radius:9px;font-size:14px;outline:none;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  button{cursor:pointer;border:none;border-radius:10px;font-size:14px;font-weight:600;padding:10px 16px;background:var(--accent);color:#fff;transition:.15s}
  button:hover{background:var(--accent2)}
  button.ghost{background:var(--chip);color:var(--txt);border:1px solid var(--line)}
  button.ghost:hover{background:var(--panel2)}
  button.sm{padding:6px 11px;font-size:13px}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:34px 16px;text-align:center;color:var(--muted);
    transition:.15s;cursor:pointer;background:var(--panel2)}
  .drop.drag{border-color:var(--accent);color:var(--txt);background:#12203a}
  .drop b{color:var(--txt)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600}
  .muted{color:var(--muted)}
  .pill{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
  .stat{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  .stat .b{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;min-width:100px}
  .stat .b .n{font-size:22px;font-weight:800}
  .stat .b .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .drivers{display:grid;grid-template-columns:1fr;gap:10px}
  .drv{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px}
  .tag.fijo{background:#123023;color:#7ee2a8;border:1px solid #1f5238}
  .tag.fr{background:#3a2412;color:#f7c073;border:1px solid #6b4318}
  .route{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .route .rhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:12px 14px;background:var(--panel2)}
  .route .rhd .who{font-weight:800;font-size:16px}
  .margin.pos{color:var(--green)} .margin.low{color:var(--amber)} .margin.neg{color:var(--red)}
  .batch{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden}
  .batch .bhd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;background:#12151c}
  .batch .bhd b{font-size:14px}
  .batch ol{margin:0;padding:6px 12px 12px 34px;font-size:13px}
  .batch ol li{padding:3px 0}
  .batch .acts{padding:0 12px 12px;display:flex;gap:8px;flex-wrap:wrap}
  .maps{background:#0b8043}.maps:hover{background:#0a7038}
  .hide{display:none!important}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--line);
    padding:12px 18px;border-radius:10px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%;text-align:center}
  .warn{background:var(--redbg);border:1px solid var(--red);color:#ffb4b4;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:8px}
  .ok{background:var(--greenbg);border:1px solid #1f5238;color:#7ee2a8;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:8px}
  details.cfg{border-bottom:0}
  details.cfg > summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);
    font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;user-select:none;padding:2px 0}
  details.cfg > summary::-webkit-details-marker{display:none}
  details.cfg > summary::after{content:'';margin-left:auto;flex:0 0 auto;width:8px;height:8px;
    border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);
    transition:transform .18s;margin-right:3px}
  details.cfg[open] > summary::after{transform:rotate(-135deg)}
  details.cfg > summary:hover{color:var(--txt)}
  details.cfg > summary:hover::after{border-color:var(--txt)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}

  /* ---- Vue chauffeur / Vista conductor ---- */
  .driverview{max-width:640px}
  .dv-hd{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;position:sticky;top:0;z-index:5}
  .dv-hd .big{font-size:20px;font-weight:800}
  .remainbox{text-align:center;margin:10px 0 4px}
  .remainbox .remain-n{font-size:52px;font-weight:900;line-height:1;color:var(--amber)}
  .remainbox .remain-l{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .remainbox .remain-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .dv-batch.complete .h{background:#12241a}
  .dv-batch.complete .h b{color:#7ee2a8}
  .dv-batch.collapsed .h{opacity:.85}
  .dv-batch.finished{opacity:.6;filter:grayscale(.6)}
  .dv-batch.finished .h{background:#191b20}
  .dv-stop .a .door{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    padding:6px 8px;border-radius:7px;font-size:13px}
  .dv-stop .stbtns{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
  .dv-stop .stbtns button{width:44px;height:34px;font-size:16px;font-weight:800;border-radius:8px;padding:0;
    background:var(--chip);border:1px solid var(--line);color:var(--muted)}
  .dv-stop .stbtns .okb{color:#7ee2a8}
  .dv-stop .stbtns .nob{color:#ff9a9a}
  .dv-stop.ok{background:#0f2417}
  .dv-stop.ok .stbtns .okb{background:#0b8043;color:#fff;border-color:#0b8043}
  .dv-stop.ok .num{background:var(--greenbg);border-color:#1f5238;color:#7ee2a8}
  .dv-stop.no{background:#2a1414}
  .dv-stop.no .stbtns .nob{background:#c0392b;color:#fff;border-color:#c0392b}
  .dv-stop.no .num{background:var(--redbg);border-color:#5a2020;color:#ff9a9a}
  .dv-batch .go.start{background:#0b8043}
  .finishb{display:block;width:calc(100% - 24px);margin:10px 12px 12px;background:var(--chip);
    color:var(--txt);border:1px solid var(--line);padding:12px;font-weight:700}
  .finishb:hover{background:var(--panel2)}
  .dv-batch{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .dv-batch .h{padding:12px 14px;background:var(--panel2);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .dv-stop{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line)}
  .dv-stop input[type=checkbox]{width:30px;height:30px;margin:0;flex:0 0 auto}
  .dv-stop .num{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--chip);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
  .dv-stop .a{flex:1}
  .dv-stop .a .adr{font-weight:700;font-size:17px;line-height:1.3}
  .dv-stop .a .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .dv-stop.done .a{opacity:.4;text-decoration:line-through}
  .dv-stop.done .num{background:var(--greenbg);border-color:#1f5238;color:#7ee2a8}
  .dv-batch .go{display:block;text-align:center;background:#0b8043;color:#fff;padding:16px;font-weight:800;font-size:17px;text-decoration:none;border-bottom:1px solid #1f5238}
  .progress{height:8px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;background:var(--green);width:0}
  .report-btn{width:100%;margin-top:6px;background:#7c3aed}.report-btn:hover{background:#6d28d9}

  /* ---- Style « application » : grille de tuiles (séries) ---- */
  .app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:16px 10px;margin:2px 0 10px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;padding:0}
  .tile:hover{background:none}
  .tile .ic{width:100%;max-width:78px;aspect-ratio:1;border-radius:20px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.4);background:linear-gradient(160deg,#3b82f6,#2563eb)}
  .tile .ic .big{font-size:30px;font-weight:900;line-height:1}
  .tile .ic .sm{font-size:11px;font-weight:700;opacity:.92;margin-top:3px}
  .tile .nm{font-size:12px;font-weight:600;color:var(--txt)}
  .tile.pending .ic{background:linear-gradient(160deg,#3b82f6,#2563eb)}
  .tile.active  .ic{background:linear-gradient(160deg,#f59e0b,#d97706)}
  .tile.done    .ic{background:linear-gradient(160deg,#16a34a,#0b8043)}
  .tile.done .nm{color:var(--muted)}
  .tile .badge-c{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
  .tile .check{position:absolute;top:7px;right:10px;font-size:15px;font-weight:900}
  .tile:active .ic{transform:scale(.94)}
  /* écran d'une série ouverte (app chauffeur) */
  .screen-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .screen-hd .backb{width:42px;height:42px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:24px;font-weight:800;padding:0;display:flex;align-items:center;justify-content:center}
  .screen-hd .backb:hover{background:var(--panel)}
  .screen-hd .ttl{font-size:22px;font-weight:800}
  .seriesgo{display:block;text-align:center;text-decoration:none;background:linear-gradient(160deg,#0b8043,#0a6d39);
    color:#fff;padding:16px;font-weight:800;font-size:17px;border-radius:16px;margin-bottom:12px;box-shadow:0 8px 18px rgba(11,128,67,.35)}
  .seriesgo:hover{background:linear-gradient(160deg,#0a7038,#095f32)}
  .stoplist{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
  .stoplist .dv-stop:first-child{border-top:none}
  /* code porte visible sous le numéro */
  .dv-stop .num-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto}
  .door-tag{display:inline-flex;align-items:center;gap:2px;background:#3a2e12;border:1px solid #6b5318;color:#f7d073;
    border-radius:999px;padding:1px 7px;font-size:12px;font-weight:800;max-width:64px;overflow:hidden}
  .door-tag.hide{display:none}
  .finishb{background:linear-gradient(160deg,#1f2530,#171a21)}
  /* carte chauffeur (tableau de bord) repliable */
  .route{border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  details.routefold{margin-top:8px}
  details.routefold>summary{font-size:13px}

  /* ---- Série vue chauffeur : barre d'actions (boutons app) + onglets ---- */
  .series-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .act-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;
    padding:15px 10px;border-radius:18px;font-size:14px;font-weight:800;border:1px solid var(--line);
    background:var(--panel2);color:var(--txt);box-shadow:0 4px 12px rgba(0,0,0,.22)}
  .act-btn .ai{font-size:23px;line-height:1}
  .act-btn:hover{background:var(--panel)}
  .act-btn.go{background:linear-gradient(160deg,#0b8043,#0a6d39);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(11,128,67,.35)}
  .act-btn.go:hover{background:linear-gradient(160deg,#0a7038,#095f32)}
  .act-btn.tab.on{background:linear-gradient(160deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(37,99,235,.35)}
  .act-btn.tab.on:hover{background:linear-gradient(160deg,var(--accent),var(--accent2))}
  /* bouton code de porte par colis */
  .doorbox{margin-top:7px}
  .doorbtn{display:flex;align-items:center;gap:7px;width:100%;justify-content:flex-start;
    background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:700}
  .doorbtn:hover{background:var(--panel2)}
  .doorbtn.has{background:#3a2e12;border-color:#6b5318;color:#f7d073}
  .doorbtn .plus{color:var(--muted);font-weight:500}
  .doorbtn .edit{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .door-edit{width:100%;margin-top:7px}
  .dv-stop.codes{align-items:flex-start}
  @media print{
    body{background:#fff;color:#000}
    .noprint{display:none!important}
    .route{page-break-inside:avoid;border-color:#ccc}
    .card{border-color:#ccc}
    a{color:#000}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
<script>
/* ============================================================
   PALANTIR — Organisateur de tournées / Organizador de rutas
   Speedaf / RXN · Vaud. Un seul fichier, sans serveur. Bilingue FR/ES.
   ============================================================ */

/* ---------------- i18n ---------------- */
let LANG = (()=>{try{return localStorage.getItem('palantir_lang')||'fr';}catch(e){return 'fr';}})();
const T = {
  sub:{fr:"Organisateur de tournées · Speedaf / RXN · Vaud", es:"Organizador de rutas · Speedaf / RXN · Vaud"},

  tagFixed:{fr:"FIXE", es:"FIJO"},
  tagFr:{fr:"FRANÇAIS", es:"FRANCÉS"},
  rate:{fr:"tarif", es:"tarifa"}, perColis:{fr:"CHF/colis", es:"CHF/paq"}, day:{fr:"jour", es:"día"},
  remove:{fr:"Retirer", es:"Quitar"}, newFixed:{fr:"Nouveau fixe", es:"Nuevo fijo"}, newFr:{fr:"Nouveau français", es:"Nuevo francés"},
  step1:{fr:"1 · Charger l'Excel de Speedaf", es:"1 · Cargar el Excel de Speedaf"},
  drop:{fr:"Glissez ici <b>votre fichier Excel</b> (.xlsx)<br><span class='muted'>ou cliquez pour le choisir</span>",
        es:"Arrastra aquí <b>tu archivo Excel</b> (.xlsx)<br><span class='muted'>o haz clic para elegirlo</span>"},
  reading:{fr:"Lecture…", es:"Leyendo…"}, readErr:{fr:"Impossible de lire le fichier : ", es:"No pude leer el archivo: "},
  step2:{fr:"2 · Colonnes détectées", es:"2 · Columnas detectadas"},
  mapperHelp:{fr:"Vérifiez que chaque donnée pointe vers la bonne colonne.", es:"Verifica que cada dato apunte a la columna correcta."},
  c_tracking:{fr:"Tracking", es:"Tracking"}, c_npa:{fr:"Code postal (NPA)", es:"Código postal (NPA)"},
  c_city:{fr:"Ville", es:"Ciudad"}, c_address:{fr:"Adresse", es:"Dirección"}, c_prov:{fr:"Province", es:"Provincia"}, c_weight:{fr:"Poids", es:"Peso"},
  none:{fr:"— aucune —", es:"— ninguna —"},
  preview:{fr:"Aperçu", es:"Vista previa"}, colis:{fr:"Colis", es:"Paquetes"}, zones:{fr:"Zones (NPA)", es:"Zonas (NPA)"}, cities:{fr:"Villes", es:"Ciudades"},
  step3:{fr:"3 · Organiser les tournées", es:"3 · Organizar las rutas"},
  strategy:{fr:"On trie par code postal (NPA), on remplit d'abord les fixes (moins chers) au maximum ; les Français ne reçoivent que le surplus. Les colis sont numérotés en série (1–10, 11–20…).",
            es:"Se ordena por código postal (NPA), se llena primero a los fijos (más baratos) al máximo; los franceses solo reciben lo que sobra. Los paquetes se numeran en serie (1–10, 11–20…)."},
  organizeBtn:{fr:"🚀 Organiser et répartir", es:"🚀 Organizar y repartir"},
  summaryTitle:{fr:"Résumé de la journée", es:"Resumen del día"},
  routes:{fr:"Tournées", es:"Rutas"}, revenue:{fr:"Revenu", es:"Ingreso"}, cost:{fr:"Coût", es:"Coste"}, margin:{fr:"Marge", es:"Margen"},
  printAll:{fr:"🖨️ Tout imprimer", es:"🖨️ Imprimir todo"},
  noFrench:{fr:"✅ Aucun chauffeur français : tout est livré par les fixes. Coût minimal.", es:"✅ Sin conductores franceses: todo lo llevan los fijos. Coste mínimo."},
  copyLink:{fr:"🔗 Copier le lien du chauffeur", es:"🔗 Copiar el link del conductor"},
  openDriver:{fr:"👁️ Ouvrir la vue chauffeur", es:"👁️ Abrir vista conductor"},
  group:{fr:"Groupe", es:"Grupo"}, stops:{fr:"arrêts", es:"paradas"}, groups:{fr:"groupes", es:"grupos"}, colisWord:{fr:"colis", es:"paquetes"},
  depotLabel:{fr:"Dépôt :", es:"Depósito:"}, delivered:{fr:"livrés", es:"entregados"},
  invalidLink:{fr:"Lien invalide.", es:"Link inválido."},
  loadFirst:{fr:"Chargez d'abord un Excel", es:"Carga primero un Excel"},
  activateDriver:{fr:"Activez au moins un chauffeur", es:"Activa al menos un conductor"},
  copied:{fr:"Lien copié ✔", es:"Link copiado ✔"},
  driverInstr:{fr:"Ouvrez chaque groupe dans Google Maps et suivez l'ordre des numéros. Cochez chaque colis livré.",
               es:"Abre cada grupo en Google Maps y sigue el orden de los números. Marca cada paquete entregado."},
  sendReport:{fr:"📤 Copier le rapport (non livrés)", es:"📤 Copiar reporte (no entregados)"},

const CFG_KEY='palantir_cfg_v1', HIST_KEY='palantir_hist_v1', REP_KEY='palantir_reports_v1';

  depot:'Renens, Suisse', price:0, batchSize:9, perDriver:130, extraPerParcel:0, minPerStop:5,
  rememberZones:false, zoneMap:{},
  drivers:[
    {name:'Chauffeur 1',type:'fijo',day:0,active:true},
    {name:'Chauffeur 2',type:'fijo',day:0,active:true},
    {name:'Chauffeur 3',type:'fijo',day:0,active:true},

};

function loadCfg(){ try{const c=JSON.parse(localStorage.getItem(CFG_KEY)); if(c&&c.drivers) return Object.assign({},DEFAULT_CFG,c);}catch(e){} return JSON.parse(JSON.stringify(DEFAULT_CFG)); }
function saveCfg(){ try{localStorage.setItem(CFG_KEY,JSON.stringify(CFG));}catch(e){} }
function getHist(){ try{return JSON.parse(localStorage.getItem(HIST_KEY))||[];}catch(e){return [];} }
function setHist(h){ try{localStorage.setItem(HIST_KEY,JSON.stringify(h.slice(0,40)));}catch(e){} }
function getReports(){ try{return JSON.parse(localStorage.getItem(REP_KEY))||[];}catch(e){return [];} }
function setReports(r){ try{localStorage.setItem(REP_KEY,JSON.stringify(r.slice(0,200)));}catch(e){} }

/* ---------------- utilitaires ---------------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const chf=n=>(Math.round(n*100)/100).toLocaleString('fr-CH',{minimumFractionDigits:2,maximumFractionDigits:2})+' CHF';
function fmtDur(min){ min=Math.round(min); const h=Math.floor(min/60), m=min%60; return h?`${h}h${m?(' '+m+'min'):''}`:`${m}min`; }
function toast(m){ const t=el('div','toast',m); document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function norm(s){ return (s==null?'':''+s).trim(); }
function b64enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
// packEnc/packDec: liens compressés (beaucoup plus courts). 'z' = compressé; sinon ancien base64.
function packEnc(o){ try{ return 'z'+LZString.compressToEncodedURIComponent(JSON.stringify(o)); }catch(e){ return b64enc(o); } }
function packDec(s){ if(s && s[0]==='z'){ return JSON.parse(LZString.decompressFromEncodedURIComponent(s.slice(1))); } return b64dec(s); }
function b64dec(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function today(){ return new Date().toISOString().slice(0,10); }
function langToggle(){ return `<div class="lang noprint"><button class="${LANG==='fr'?'on':''}" onclick="setLang('fr')">FR</button><button class="${LANG==='es'?'on':''}" onclick="setLang('es')">ES</button></div>`; }
function mapsLink(stops, origin){
  // Format « chemin » : /maps/dir/Origine/Arrêt1/Arrêt2/... — compatible partout.
  // origin = point de départ (dépôt pour le 1er groupe, sinon dernier arrêt du groupe précédent
  // pour ne PAS revenir à Renens entre les groupes).
  const o = (origin!=null && origin!=='') ? origin : CFG.depot;
  const parts=[o, ...stops.map(s=>`${s.address}, ${s.npa} ${s.city}, Suisse`)];
  return 'https://www.google.com/maps/dir/'+parts.map(p=>encodeURIComponent(p)).join('/');
}

function importCfgFromHash(){
  try{
    const c=packDec(location.hash.slice(5));
    if(c && c.drivers) CFG=Object.assign(JSON.parse(JSON.stringify(DEFAULT_CFG)),c);
    saveCfg();
  }catch(e){}
  // nettoyer l'URL pour ne pas ré-importer
  history.replaceState(null,'',location.pathname);
}

/* ============================================================
   VUE CHAUFFEUR / VISTA CONDUCTOR  (uniquement les tournées)
   ============================================================ */
function renderDriver(){
  let data;
  try{ data=packDec(location.hash.slice(3)); }catch(e){ $('#app').innerHTML='<p class="warn">'+L('invalidLink')+'</p>'; return; }
  if(data.lang) LANG=data.lang;
  document.title=(LANG==='fr'?'Tournée · ':'Ruta · ')+data.n;
  const app=$('#app'); app.className='wrap driverview';
  const total=data.b.reduce((a,b)=>a+b.length,0);
  const storeKey='dv_done_'+(data.id||data.n);
  let done={}; try{done=JSON.parse(localStorage.getItem(storeKey))||{};}catch(e){}

  // états : done[bi_si] = 'ok' (livré) | 'no' (non livré) ; fin['s'+bi]=true (série terminée) ; codes[bi_si]=code porte
  const code=(bi,si)=>(bi+1)*10+(si+1);            // série 4 · position 9 -> 49
  let fin={}; try{fin=JSON.parse(localStorage.getItem(storeKey+'_fin'))||{};}catch(e){}
  let codes={}; try{codes=JSON.parse(localStorage.getItem(storeKey+'_codes'))||{};}catch(e){}
  let sugg=''; try{ sugg=localStorage.getItem(storeKey+'_sugg')||''; }catch(e){}
  const save=()=>{ try{ localStorage.setItem(storeKey,JSON.stringify(done)); localStorage.setItem(storeKey+'_fin',JSON.stringify(fin)); localStorage.setItem(storeKey+'_codes',JSON.stringify(codes)); }catch(e){} };
  // Mémoire des codes de porte PAR ADRESSE (partagée entre séries et entre jours, sur cet appareil)
  let doorMem={}; try{ doorMem=JSON.parse(localStorage.getItem('palantir_doors'))||{}; }catch(e){}
  const akey=s=>((s.a||'')+'|'+(s.p||'')).toLowerCase().replace(/\s+/g,' ').trim();
  const rememberDoor=(s,v)=>{ const k=akey(s); if(v) doorMem[k]=v; else delete doorMem[k]; try{ localStorage.setItem('palantir_doors',JSON.stringify(doorMem)); }catch(e){} };
  // On sauvegarde aussi la dernière tournée reçue sur l'appareil (pour la retrouver sans le lien)
  try{ localStorage.setItem('palantir_last_route', location.hash); localStorage.setItem('palantir_last_route_n', data.n); }catch(e){}
  const okCount=()=>Object.values(done).filter(v=>v==='ok').length;
  const noCount=()=>Object.values(done).filter(v=>v==='no').length;
  const seriesOrigin=bi=>{ if(bi===0) return (data.d||CFG.depot); const p=data.b[bi-1][data.b[bi-1].length-1]; return `${p.a}, ${p.p} ${p.c}, Suisse`; };
  let openIndex=(function(){ for(let bi=0;bi<data.b.length;bi++) if(!fin['s'+bi]) return bi; return -1; })();

  let screen='home';    // 'home' = grille des séries ; sinon index de la série ouverte
  let subview='adr';    // dans une série : 'adr' = adresses (livraison) | 'cod' = codes de porte

  // bouton « code de porte » par colis : montre le code si connu, permet d'ajouter / modifier
  function doorControl(s,id){
    const box=el('div','doorbox');
    const cur=()=> (codes[id]!=null && codes[id]!=='') ? codes[id] : (doorMem[akey(s)]||'');
    function showBtn(){
      box.innerHTML=''; const v=cur();
      const b=el('button','doorbtn'+(v?' has':''));
      b.innerHTML = v ? `🔑 <b>${(''+v).replace(/</g,'&lt;')}</b><span class="edit">${L('editDoor')}</span>`
                      : `🔑 <span class="plus">${L('addDoor')}</span>`;
      b.onclick=()=>showInput(v); box.appendChild(b);
    }
    function showInput(v){
      box.innerHTML=''; const inp=el('input','door-edit');
      inp.value=v; inp.placeholder='🔑 '+L('doorCode'); inp.setAttribute('inputmode','text');
      const commit=()=>{ const nv=inp.value.trim(); codes[id]=nv; rememberDoor(s,nv); save(); showBtn(); };
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
      inp.addEventListener('blur',commit);
      box.appendChild(inp); inp.focus();
    }
    showBtn(); return box;
  }

  // une série = une « app » (tuile) sur l'écran d'accueil
  function tile(bi){
    const batch=data.b[bi];
    const dOk=batch.filter((s,si)=>done[bi+'_'+si]==='ok').length;
    const dNo=batch.filter((s,si)=>done[bi+'_'+si]==='no').length;
    const finished=!!fin['s'+bi];
    const remaining=batch.length-dOk-dNo;
    const state=finished?'done':((dOk+dNo>0)?'active':'pending');
    const t=el('button','tile '+state);
    const badge=(!finished && remaining>0 && (dOk+dNo)>0)?`<span class="badge-c">${remaining}</span>`:'';
    const sub=finished?`✓ ${dOk}`:`${dOk+dNo}/${batch.length}`;
    t.innerHTML=`<div class="ic">${finished?'<div class="check">✓</div>':''}${badge}<div class="big">${bi+1}</div><div class="sm">${sub}</div></div><div class="nm">${L('seriesWord')} ${bi+1}</div>`;
    t.onclick=()=>{ screen=bi; render(); };
    return t;
  }

  // écran d'UNE série (on entre « dans l'app ») : barre de boutons + liste
  function seriesScreen(bi){
    const batch=data.b[bi], finished=!!fin['s'+bi];
    const wrap=el('div','series-screen');
    const hd=el('div','screen-hd');
    hd.innerHTML=`<button class="backb" title="←">‹</button><div class="ttl">${L('seriesWord')} ${bi+1}</div><div class="muted" style="margin-left:auto;font-size:13px">${batch.length} ${L('stops')}</div>`;
    hd.querySelector('.backb').onclick=()=>{ screen='home'; render(); };
    wrap.appendChild(hd);

    // barre d'actions : boutons style application
    const acts=el('div','series-actions');
    const go=el('a','act-btn go'); go.href=mapsLink(batch.map(s=>({address:s.a,npa:s.p,city:s.c})),seriesOrigin(bi)); go.target='_blank';
    go.innerHTML=`<span class="ai">▶</span>${L('startRoute')}`;
    const finb=el('button','act-btn fin'); finb.innerHTML=`<span class="ai">✓</span>${finished?L('reopenSeries'):L('finishRoute')}`;
    finb.onclick=()=>{ const nowFin=!fin['s'+bi]; fin['s'+bi]=nowFin; save(); if(nowFin) screen='home'; render(); };
    const tabA=el('button','act-btn tab'+(subview==='adr'?' on':'')); tabA.innerHTML=`<span class="ai">📋</span>${L('tabAddr')}`;
    tabA.onclick=()=>{ subview='adr'; render(); };
    const tabC=el('button','act-btn tab'+(subview==='cod'?' on':'')); tabC.innerHTML=`<span class="ai">🔑</span>${L('tabCodes')}`;
    tabC.onclick=()=>{ subview='cod'; render(); };
    acts.append(go,finb,tabA,tabC);
    wrap.appendChild(acts);

    // liste selon l'onglet actif
    const list=el('div','stoplist');
    batch.forEach((s,si)=>{
      const id=bi+'_'+si, stt=done[id]||'';
      const st=el('div','dv-stop '+(subview==='cod'?'codes ':'')+(stt==='ok'?'ok':stt==='no'?'no':''));
      const num=el('div','num-wrap'); num.innerHTML=`<div class="num">${code(bi,si)}</div>`;
      const a=el('div','a'); a.innerHTML=`<div class="adr">${s.a}</div><div class="sub">${s.p} ${s.c}</div>`;
      a.appendChild(doorControl(s,id));
      st.append(num,a);
      if(subview==='adr'){
        const btns=el('div','stbtns');
        const ok=el('button','okb'); ok.title=L('delivered'); ok.textContent='✓';
        ok.onclick=()=>{ done[id]=done[id]==='ok'?'':'ok'; save(); render(); };
        const no=el('button','nob'); no.title=L('notDelivered'); no.textContent='✕';
        no.onclick=()=>{ done[id]=done[id]==='no'?'':'no'; save(); render(); };
        btns.append(ok,no); st.append(btns);
      }
      list.appendChild(st);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function render(){
    app.innerHTML='';
    if(screen!=='home'){ app.appendChild(seriesScreen(screen)); window.scrollTo(0,0); return; }

    const remain=total-okCount();
    const hd=el('div','dv-hd');
    hd.innerHTML=`<div style="display:flex;align-items:center"><div class="big">🚚 ${data.n}</div>${langToggle()}</div>
      <div class="remainbox"><div class="remain-n">${remain}</div><div class="remain-l">${L('remainLabel')}</div>
        <div class="remain-sub">${okCount()}/${total} ${L('delivered')}${noCount()?` · ${noCount()} ${L('notDelivered').toLowerCase()}`:''}</div></div>
      <div class="progress"><i style="width:${total?((okCount()+noCount())/total*100):0}%"></i></div>`;
    app.appendChild(hd);

    const lbl=el('div','muted'); lbl.style.cssText='font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin:2px 2px 8px'; lbl.textContent=L('seriesWord')+'s';
    app.appendChild(lbl);
    const grid=el('div','app-grid');
    data.b.forEach((b,bi)=>grid.appendChild(tile(bi)));
    app.appendChild(grid);

    const sg=el('div','card'); sg.style.marginTop='8px';
    sg.innerHTML=`<label style="font-size:13px">${L('suggTitle')}</label>
      <textarea id="sugg" rows="2" placeholder="${L('suggPh')}">${sugg}</textarea>`;
    app.appendChild(sg);
    sg.querySelector('#sugg').addEventListener('input',ev=>{ sugg=ev.target.value; try{localStorage.setItem(storeKey+'_sugg',sugg);}catch(e){} });

    const rep=el('button','report-btn'); rep.textContent=L('sendReport');
    rep.onclick=()=>{
      const undel=[];
      data.b.forEach((batch,bi)=>batch.forEach((s,si)=>{ if(done[bi+'_'+si]!=='ok') undel.push({a:s.a,p:s.p,c:s.c,num:code(bi,si)}); }));
      const now=new Date().toTimeString().slice(0,5);
      const report={n:data.n,date:today(),tot:total,del:okCount(),u:undel,sugg:sugg,fin:now};
      const link=location.origin+location.pathname+'#report='+packEnc(report);
      navigator.clipboard.writeText(link); toast(L('reportCopied'));
    };
    app.appendChild(rep);
  }
  render();
}

       <div style="margin-top:12px">

function wireConfig(){

/* ---------------- chargement fichier ---------------- */
function wireDrop(){
  const drop=$('#drop'), file=$('#file'); if(!drop) return;
  drop.onclick=()=>file.click();
  file.onchange=e=>{ if(e.target.files[0]) readFile(e.target.files[0]); };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag');}));
  drop.addEventListener('drop',e=>{ if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });
}
function readFile(f){
  $('#loadmsg').innerHTML='<p class="muted">'+L('reading')+'</p>';
  const r=new FileReader();
  r.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:'array'}); RAW=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}); detectAndMap(); }
    catch(err){ $('#loadmsg').innerHTML='<p class="warn">'+L('readErr')+err.message+'</p>'; } };
  r.readAsArrayBuffer(f);
}
function detectAndMap(){
  if(!$('#mapper')) return;
  let headerRow=-1;
  for(let i=0;i<Math.min(RAW.length,20);i++){ const j=RAW[i].map(c=>(''+c).toLowerCase()).join('|'); if(j.includes('address')||j.includes('adresse')){headerRow=i;break;} }
  if(headerRow<0){ for(let i=0;i<RAW.length;i++){ if(RAW[i].filter(c=>norm(c)).length>=4){headerRow=i;break;} } }
  const headers=RAW[headerRow].map(norm);
  const guess=(...ks)=>{ for(let j=0;j<headers.length;j++){ const h=headers[j].toLowerCase(); if(ks.some(k=>h.includes(k))) return j; } return -1; };
  COLMAP={ headerRow, tracking:guess('tracking','waybill','suivi','no.'), npa:guess('post code','postcode','npa','code postal','zip','cp'),
    prov:guess('province','peovince','canton'), city:guess('city','ville','ciudad','localit'),
    address:guess('address','adresse','direccion','rue','street'), weight:guess('weight','poids','peso') };
  buildMapper(headers); applyMap();
}
function buildMapper(headers){
  const m=$('#mapper'); if(!m) return; m.classList.remove('hide');
  const opts=sel=>headers.map((h,j)=>`<option value="${j}" ${sel===j?'selected':''}>${h||('Col '+j)}</option>`).join('');
  m.innerHTML=`<details class="cfg"><summary>${L('step2')} <span class="muted" style="text-transform:none;font-weight:400">· ${L('mapperHelp')}</span></summary>
   <div class="grid2" style="margin-top:12px">${[['tracking',L('c_tracking')],['npa',L('c_npa')],['city',L('c_city')],['address',L('c_address')],['prov',L('c_prov')],['weight',L('c_weight')]]
     .map(([k,l])=>`<div class="field"><label>${l}</label><select data-k="${k}"><option value="-1">${L('none')}</option>${opts(COLMAP[k])}</select></div>`).join('')}</div></details>`;
  m.querySelectorAll('select').forEach(s=>{ s.value=COLMAP[s.dataset.k]; s.onchange=()=>{COLMAP[s.dataset.k]=+s.value;applyMap();}; });
}
function applyMap(){
  PARCELS=[];
  for(let i=COLMAP.headerRow+1;i<RAW.length;i++){ const row=RAW[i]; if(!row) continue;
    const address=norm(row[COLMAP.address]); if(!address) continue;
    PARCELS.push({ tracking:norm(row[COLMAP.tracking]), address, npa:norm(row[COLMAP.npa]), city:norm(row[COLMAP.city]), prov:norm(row[COLMAP.prov]), weight:norm(row[COLMAP.weight]) }); }
  showPreview();
}
function showPreview(){
  const p=$('#preview'); if(!p) return; p.classList.remove('hide');

/* ---------------- cœur : organiser ---------------- */
function mkRoute(drv,chunk){ const batches=[]; for(let i=0;i<chunk.length;i+=CFG.batchSize) batches.push(chunk.slice(i,i+CFG.batchSize)); return {driver:drv,parcels:chunk,batches}; }
function organize(){
  if(!PARCELS.length){toast(L('loadFirst'));return;}
  const active=CFG.drivers.filter(d=>d.active); if(!active.length){toast(L('activateDriver'));return;}
  const sorted=[...PARCELS].sort((a,b)=>{ const na=(''+a.npa),nb=(''+b.npa); if(na!==nb) return na<nb?-1:1; return a.address<b.address?-1:1; });
  const fixed=active.filter(d=>d.type!=='fr'), french=active.filter(d=>d.type==='fr');
  const cap=Math.max(1,CFG.perDriver);
  const bag=new Map(); active.forEach(d=>bag.set(d.name,[]));
  let pool=sorted.slice(); let overflow=false;

  // 1) zones habituelles : chaque chauffeur reprend d'abord ses NPA de la dernière fois
  if(CFG.rememberZones && CFG.zoneMap){
    [...fixed,...french].forEach(drv=>{
      const npas=CFG.zoneMap[drv.name]; if(!npas||!npas.length) return;
      const set=new Set(npas.map(String));
      const mine=[]; pool=pool.filter(p=>{ if(mine.length<cap && set.has(''+p.npa)){ mine.push(p); return false; } return true; });
      bag.set(drv.name, bag.get(drv.name).concat(mine));
    });
  }
  // 2) remplir les fixes (moins chers) jusqu'à capacité avec le reste
  fixed.forEach(drv=>{ const left=cap-bag.get(drv.name).length; if(left<=0||!pool.length) return; const take=pool.splice(0,left); bag.set(drv.name, bag.get(drv.name).concat(take)); });
  // 3) surplus aux Français, réparti équitablement
  if(pool.length){
    if(french.length){ const per=Math.ceil(pool.length/french.length); french.forEach(drv=>{ if(!pool.length) return; const take=pool.splice(0,per); bag.set(drv.name, bag.get(drv.name).concat(take)); }); }
    else { overflow=true; const last=fixed[fixed.length-1]; if(last){ bag.set(last.name, bag.get(last.name).concat(pool)); pool=[]; } }
  }
  // 4) construire ROUTES dans l'ordre (fixes puis français)
  ROUTES=[];
  [...fixed,...french].forEach(drv=>{ const list=bag.get(drv.name); if(list&&list.length) ROUTES.push(mkRoute(drv,list)); });
  // numérotation en série + mémoriser les zones
  const newZoneMap={};
  ROUTES.forEach(r=>{ let c=0; r.parcels.forEach(p=>{ p.seq=++c; }); newZoneMap[r.driver.name]=[...new Set(r.parcels.map(p=>''+p.npa))]; });
  CFG.zoneMap=newZoneMap; saveCfg();
  LAST_OVERFLOW=overflow; saveHistory(); renderResults(overflow);
}
function driverCost(drv,n){ return drv.type==='fr'?drv.rate*n:(drv.day||0); }

function saveHistory(){
  const totP=ROUTES.reduce((a,r)=>a+r.parcels.length,0);
  const rev=CFG.price*totP; let cost=0; ROUTES.forEach(r=>cost+=driverCost(r.driver,r.parcels.length)+CFG.extraPerParcel*r.parcels.length);
  const entry={ date:today(), ts:Date.now(), colis:totP, routes:ROUTES.length, rev, cost, margin:rev-cost,
    drivers:ROUTES.map(r=>({name:r.driver.name,type:r.driver.type,colis:r.parcels.length,pay:driverCost(r.driver,r.parcels.length)})),
    link:driverLinksBundle() };
  const h=getHist(); const i=h.findIndex(e=>e.date===entry.date);
  if(i>=0) h[i]=entry; else h.unshift(entry);
  setHist(h);
}
function driverLinksBundle(){ return ROUTES.map(r=>({name:r.driver.name,link:driverLink(r)})); }

function renderResults(overflow){

      ${overflow?`<div class="warn">${fOverflow(totP)}</div>`:''}

      </div></div>`;
  sum.querySelectorAll('[data-waall]').forEach(b=>b.onclick=()=>waOpen(ROUTES[+b.dataset.waall]));

        <div class="who">🚚 ${r.driver.name} <span class="tag ${isfr?'fr':'fijo'}">${isfr?L('tagFr'):L('tagFixed')}</span></div>
        <div class="muted">${n} ${L('colisWord')} · ${r.batches.length} ${L('seriesWord').toLowerCase()}s · ⏱ ${L('estTime')} ~${fmtDur(n*(CFG.minPerStop||5))}</div></div>
        <div style="text-align:right"><div class="margin ${mcls}" style="font-size:18px;font-weight:800">${chf(mar)}</div>
        <div class="muted" style="font-size:12px">${fRevMinus(chf(rev),chf(cost+extra))}</div></div></div>
      <div style="padding:8px 14px 14px">
        <div class="noprint" style="margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap">
          <button class="sm" style="background:#25D366;color:#0a2e17" data-wa="${ri}">${L('waBtn')}</button>

          <div class="batches"></div></details></div>`;
    const bc=box.querySelector('.batches'); let counter=0;
    r.batches.forEach((batch,bi)=>{

function driverLink(r){
  // sans tracking (le chauffeur navigue par numéro série+position) -> lien beaucoup plus court
  const data={ id:r.driver.name.replace(/\s/g,'_')+'_'+today(), n:r.driver.name, d:CFG.depot, lang:LANG,
    b:r.batches.map(batch=>batch.map(s=>({a:s.address,p:s.npa,c:s.city}))) };
  return location.origin+location.pathname+'#r='+packEnc(data);
}
function waOpen(r){
  const link=driverLink(r);
  const msg=fWaMsg(r.driver.name,today(),r.parcels.length,link);
  let phone=(r.driver.phone||'').replace(/[^\d]/g,'');
  if(phone && phone[0]==='0') phone='41'+phone.slice(1); // Suisse : 0xx -> 41xx
  const url = phone ? `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`
                    : `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
  if(!phone) toast(L('waNoPhone'));
  window.open(url,'_blank');
}

  out.innerHTML=reps.map(r=>`<div class="card">
     <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
       <div><b>🚚 ${r.n}</b> <span class="muted">· ${r.date}${r.fin?' · '+L('colFinish')+' '+r.fin:''}</span></div>
       <div class="stat" style="margin:0">
         <div class="b"><div class="n">${r.tot}</div><div class="l">${L('colTotal')}</div></div>
         <div class="b"><div class="n" style="color:var(--green)">${r.del}</div><div class="l">${L('colDelivered')}</div></div>
         <div class="b"><div class="n" style="color:var(--red)">${r.u.length}</div><div class="l">${L('colUndel')}</div></div>
       </div></div>
     ${r.sugg?`<div class="ok" style="margin-top:8px;background:#1a2436;border-color:#2a3a52;color:#cdd9ec">💡 <b>${L('colSugg')}:</b> ${r.sugg}</div>`:''}
     ${r.u.length?`<table style="margin-top:10px"><thead><tr><th>#</th><th>${L('c_address')}</th><th>NPA</th><th>${L('c_city')}</th></tr></thead>
       <tbody>${r.u.map(s=>`<tr><td><b>${s.num||''}</b></td><td>${s.a}</td><td>${s.p}</td><td>${s.c}</td></tr>`).join('')}</tbody></table>`
       :`<div class="ok" style="margin-top:8px">${L('allDelivered')}</div>`}
   </div>`).join('');
}

/* ============================================================
   PAIEMENTS / PAGOS
   ============================================================ */
let PAY_MODE='week';
function renderPayments(c){
  const h=getHist();
  const from = PAY_MODE==='today' ? today() : new Date(Date.now()-6*864e5).toISOString().slice(0,10);
  const rows=h.filter(e=> PAY_MODE==='today' ? e.date===today() : e.date>=from );
  // agréger par chauffeur
  const agg={};
  rows.forEach(e=>(e.drivers||[]).forEach(d=>{
    if(!agg[d.name]) agg[d.name]={name:d.name,type:d.type,days:0,colis:0,pay:0};
    const a=agg[d.name]; a.days++; a.colis+=d.colis||0; a.pay+=(d.pay!=null?d.pay:0);
  }));
  const list=Object.values(agg).sort((a,b)=>b.pay-a.pay);
  const total=list.reduce((s,a)=>s+a.pay,0);
  c.innerHTML=`<div class="card"><h2>${L('payTitle')}</h2>
    <div class="menu" style="margin:0 0 12px">
      <button class="${PAY_MODE==='today'?'on':''}" onclick="setPayMode('today')">${L('payToday')}</button>
      <button class="${PAY_MODE==='week'?'on':''}" onclick="setPayMode('week')">${L('payWeek')}</button>
    </div>
    ${!list.length?`<p class="muted">${L('payEmpty')}</p>`:`
    <table><thead><tr><th>${L('colDriver')}</th><th></th><th>${L('payDays')}</th><th>${L('colis')}</th><th>${L('payToPay')}</th></tr></thead>
    <tbody>${list.map(a=>`<tr>
      <td><b>${a.name}</b></td>
      <td><span class="tag ${a.type==='fr'?'fr':'fijo'}">${a.type==='fr'?L('tagFr'):L('tagFixed')}</span></td>
      <td>${a.days}</td><td>${a.colis}</td>
      <td><b style="color:var(--green)">${chf(a.pay)}</b></td></tr>`).join('')}
      <tr><td colspan="4" style="text-align:right"><b>${L('payTotal')}</b></td><td><b style="color:var(--amber)">${chf(total)}</b></td></tr>
    </tbody></table>
    <p class="muted" style="margin-top:10px">${L('payNote')}</p>`}
  </div>`;
}
function setPayMode(m){ PAY_MODE=m; renderPayments($('#tab')); }
</script>
